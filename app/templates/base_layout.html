<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ NOMBRE_PRODUCTO }}{% endblock %} · {{ NOMBRE_PRODUCTO }}</title>
  <link rel="icon" href="{{ estatico('img/ic_launcher_round.webp') }}" type="image/webp">
  {# Recursos locales con versión fijada (ver static/vendor/README.md). Sin CDN. #}
  <link rel="stylesheet" href="{{ estatico('vendor/tabler-1.5.1/css/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ estatico('vendor/tabler-icons-3.48.0/tabler-icons.min.css') }}">
  <link rel="stylesheet" href="{{ estatico('css/automate.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block clase_body %}{% endblock %}"{% block atributos_body %}{% endblock %}>
  {% block cuerpo %}{% endblock %}
  <script src="{{ estatico('vendor/tabler-1.5.1/js/tabler.min.js') }}"></script>
  <script src="{{ estatico('js/interaccion.js') }}"></script>
  {% if current_user.is_authenticated %}<script src="{{ estatico('js/sesion.js') }}"></script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
