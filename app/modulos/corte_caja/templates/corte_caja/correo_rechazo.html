{# Correo de rechazo. Se renderiza con autoescape: el asunto y los motivos que vienen del remitente
   nunca se interpretan como HTML. Estilos en línea y tabla de ancho fijo porque Outlook ignora <style>. #}
{%- set hoy_texto = hoy.strftime("%d/%m/%Y") -%}
{%- set hoy_compacto = hoy.strftime("%d%m%Y") -%}
<html>
<head><meta charset="UTF-8"></head>
<body style="background-color: #f1f5f9; padding: 15px; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<table width="480" align="center" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; color: #333; line-height: 1.6;">
  <tr><td style="padding: 0;">

    <div style="background: #b71c1c; color: white; padding: 25px 20px; text-align: center;">
      <h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;">Aviso de rechazo</h2>
      <p style="margin: 8px 0 0 0; font-size: 15px;">Su envío no pudo ser procesado</p>
    </div>

    <div style="padding: 25px 20px;">
      <p style="font-size: 16px; margin-top: 0;">Estimado usuario,</p>
      <p style="font-size: 15px;">El correo con asunto
        <strong style="color: #000; background: #f0f0f0; padding: 3px 6px; border-radius: 4px; word-break: break-all;">"{{ asunto }}"</strong>
        no cumple con los lineamientos corporativos.</p>

      <div style="background-color: #fff3cd; color: #856404; padding: 15px; border-left: 4px solid #ffeeba; border-radius: 4px; margin-top: 15px; font-size: 14px;">
        <div style="font-weight: 600;">[!] ACCIÓN REQUERIDA: es obligatorio volver a enviar el correo de corte de caja con las correcciones.</div>
        <div style="font-size: 14px; color: #664d03; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(133, 100, 4, 0.2);">
          Envíe nuevamente el correo corregido a:<br>
          <a href="mailto:{{ buzon_reenvio }}" style="color: #d32f2f; text-decoration: none; font-size: 15px; font-weight: bold;">{{ buzon_reenvio }}</a>
        </div>
      </div>

      <div style="background-color: #fff8f8; border: 1px solid #ffcdd2; border-left: 5px solid #d32f2f; padding: 15px; margin: 25px 0; border-radius: 6px;">
        <h3 style="margin-top: 0; color: #b71c1c; font-size: 16px;">Motivo(s):</h3>
        <ul style="margin-bottom: 0; color: #c62828; padding-left: 20px; font-size: 14px;">
          {%- for e in errores %}
          <li style="margin-bottom: 8px;"><b>{{ e.titulo }}:</b> {{ e.detalle }}</li>
          {%- endfor %}
        </ul>
      </div>

      <h3 style="color: #1976d2; border-bottom: 2px solid #e3f2fd; padding-bottom: 8px; margin-top: 35px; font-size: 18px;">Instrucciones para corregirlo</h3>
      <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin: 15px 0 25px 0;">
        <h4 style="margin-top: 0; color: #0f172a; font-size: 15px; border-left: 3px solid #3b82f6; padding-left: 10px;">1. Formato del asunto</h4>
        <div style="background: #ffffff; padding: 10px; border: 1px dashed #cbd5e1; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 13px; color: #334155;">
          &bull; Corte de Caja, [Nombre de tu Empresa], {{ hoy_texto }}<br><br>
          &bull; Corte de Caja, [Nombre de tu Empresa], {{ hoy_texto }} Corrección
        </div>

        <h4 style="margin-top: 25px; color: #0f172a; font-size: 15px; border-left: 3px solid #3b82f6; padding-left: 10px;">2. Formato de archivos (PDF o Excel)</h4>
        <div style="background: #ffffff; padding: 10px; border: 1px dashed #cbd5e1; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 13px; color: #334155;">
          <span style="color: #64748b; font-size: 12px; font-family: 'Segoe UI', sans-serif; font-style: italic;">Extensiones permitidas: .pdf, .xls, .xlsx, .xlsm (macros)</span><br><br>
          &bull; {{ hoy_compacto }}-[Nomenclatura de la Empresa]-[Tipo de Documento].xlsm<br>
          &bull; {{ hoy_compacto }}-[Nomenclatura de la Empresa]-[Tipo de Documento].pdf<br><br>
          <span style="color: #64748b; font-size: 12px; font-family: 'Segoe UI', sans-serif; font-style: italic;">Ejemplo si la nomenclatura fuera "ABC":</span><br>
          &bull; {{ hoy_compacto }}-ABC-[Tipo de Documento].pdf
        </div>
      </div>
    </div>

    <div style="background-color: #f8f9fa; color: #888; font-size: 12px; text-align: center; padding: 20px; border-top: 1px solid #eaeaea;">
      <p style="margin: 0;">Mensaje automático de ORBIT Canella.</p>
      <p style="margin: 5px 0 0 0;"><strong>No responda a este correo.</strong></p>
    </div>

  </td></tr>
</table>
</body>
</html>
